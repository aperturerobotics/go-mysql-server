name: Test
on:
  pull_request:
  push:
    branches: [aperture]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Install ICU4C (MacOS)
      if: ${{ matrix.platform == 'macos-latest' }}
      run: |
        dir=$(brew --cellar icu4c)
        dir="$dir"/$(ls "$dir")
        echo CGO_CPPFLAGS=-I$dir/include >> $GITHUB_ENV
        echo CGO_LDFLAGS=-L$dir/lib >> $GITHUB_ENV
    - name: Install ICU4C (Windows)
      if: ${{ matrix.platform == 'windows-latest' }}
      uses: msys2/setup-msys2@v2
      with:
        path-type: inherit
        msystem: UCRT64
        pacboy: icu:p toolchain:p pkg-config:p
    - name: Test
      if: ${{ matrix.platform == 'macos-latest' }}
      run: go test -timeout=2m -tags=gms_icu_regex ./...
      env:
        CI_TEST: "true"
    - name: Test
      if: ${{ matrix.platform == 'windows-latest' }}
      shell: msys2 {0}
      run: go.exe test -timeout=2m -tags=gms_icu_regex ./...
      env:
        CI_TEST: "true"
    - name: Test
      if: ${{ matrix.platform == 'ubuntu-latest' }}
      run: bash .github/workflows/scripts/test-race.sh
      env:
        CI_TEST: "true"

  pure-go:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Build default and lite profiles
      run: |
        go build ./...
        go build -tags=sql_lite,gms_pure_go ./...
    - name: Test default regex and formatting
      run: go test -timeout=2m ./sql/expression/function -run '^(TestFormat|TestRegexpLikeWithoutFlags)$'
