name: Test Server Engine
on:
  pull_request:
  push:
    branches: [aperture]

concurrency:
  group: server-engine-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test using Server Engine
        run: go test -timeout=2m -tags=gms_icu_regex ./...
        env:
          CI_TEST: "true"
          SERVER_ENGINE_TEST: "true"
      - name: Test using Server Engine
        run: bash .github/workflows/scripts/test-race.sh
        env:
          CI_TEST: "true"
          SERVER_ENGINE_TEST: "true"
